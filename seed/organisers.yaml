# Seed registry (ADR 0002 D14). PARTIAL: the high-yield feeds from R3 and the golden-set
# organisers, 2026-10-07. The full curation of the ~240 sweep rows is still to do.
# kind: feed (ICS/RSS), listing (an events page), event_page (a single event).
# class is optional: ticket platforms are TICKET, `aggregators` in profile.yaml are AGG,
# everything else is OWN.
# ai_focus: true when the organiser's events count as AI-relevant without an AI keyword in
# their text (profile.yaml). Default false: general calendars (TUM central, BAdW) and startup
# or cloud groups then need a keyword or the LLM to reach B. ITCS, hackaTUM and DLD are not
# AI-only, but eval/golden.yaml tags them A, so they carry the flag.
# standing (ADR 0021): anchor, a community the board exists for (radar/clubs.md Tier 1 and
# the joint institutions in the records repository): every event at least B; community, an
# organiser running its own events: never off topic; calendar (the default), a listing of
# many organisers' events: each needs a topic. The seed owns ai_focus and standing of every
# organiser it names by domain and name, also one an intake added (CDTM).

- name: Munich NLP
  domain: luma.com/munichnlp
  standing: community
  kind: community
  ai_focus: true
  sources: [{url: https://luma.com/munichnlp, kind: listing}]
