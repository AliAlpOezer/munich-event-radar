name: harvest
on:
  # Once a day (ADR 0009), 04:17 UTC: 06:17 Berlin in summer, 05:17 in winter, after the
  # LLM budget's UTC day turns. Off the full hour, when GitHub is busiest and may drop runs.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
concurrency:
  group: harvest
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: event-radar seed
        env:
          RADAR_DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
      - run: event-radar harvest
        env:
          RADAR_DATABASE_URL: ${{ secrets.RADAR_DATABASE_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
