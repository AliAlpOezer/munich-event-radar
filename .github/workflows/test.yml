name: test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # The major Supabase runs (ADR 0004).
        image: postgres:17
        env:
          POSTGRES_DB: radar_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      RADAR_TEST_DATABASE_URL: postgresql://postgres@localhost/radar_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          extras: web,dev
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
