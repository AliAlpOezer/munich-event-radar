name: Set up the radar
description: Python with the radar installed in a cached virtual environment.
inputs:
  extras:
    description: Optional dependency groups to install, comma-separated
    default: ""
runs:
  using: composite
  steps:
    - id: python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
    - id: week
      shell: bash
      run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
    # Kept a week at most, so the dependencies stay current without a lockfile.
    - id: venv
      uses: actions/cache@v6
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.python.outputs.python-version }}-${{ inputs.extras }}-${{ hashFiles('pyproject.toml') }}-${{ steps.week.outputs.week }}
    # Editable, so the radar finds profile.yaml and seed/ in the checkout.
    - if: steps.venv.outputs.cache-hit != 'true'
      shell: bash
      env:
        EXTRAS: ${{ inputs.extras }}
      run: |
        python -m venv .venv
        .venv/bin/pip install -e ".${EXTRAS:+[$EXTRAS]}"
    - shell: bash
      run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
