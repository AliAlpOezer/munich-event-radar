<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Event Radar</title>
  <meta name="description" content="Every AI event in Munich worth going to, with its registration window.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="vendor/fonts/geist-v5-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <script src="theme-init.js"></script>
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <a class="brand" href="#timeline"><b>Event Radar</b> <span>Munich</span></a>
      <nav class="tabs" role="tablist" aria-label="Views">
        <a role="tab" id="tab-timeline" href="#timeline" aria-controls="view-timeline">Timeline</a>
        <a role="tab" id="tab-organisations" href="#organisations" aria-controls="view-organisations">Organisations</a>
      </nav>
      <div class="run" id="run-status" aria-live="polite"><span class="run-dot" aria-hidden="true"></span><span class="run-text">Loading</span></div>
      <button type="button" class="btn theme" id="theme-toggle" aria-label="Switch to dark theme">
        <!-- Phosphor Icons 2.1.1, regular weight (MIT) -->
        <svg class="moon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M233.54,142.23a8,8,0,0,0-8-2,88.08,88.08,0,0,1-109.8-109.8,8,8,0,0,0-10-10,104.84,104.84,0,0,0-52.91,37A104,104,0,0,0,136,224a103.09,103.09,0,0,0,62.52-20.88,104.84,104.84,0,0,0,37-52.91A8,8,0,0,0,233.54,142.23ZM188.9,190.34A88,88,0,0,1,65.66,67.11a89,89,0,0,1,31.4-26A106,106,0,0,0,96,56,104.11,104.11,0,0,0,200,160a106,106,0,0,0,14.92-1.06A89,89,0,0,1,188.9,190.34Z"/></svg>
        <svg class="sun" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M120,40V16a8,8,0,0,1,16,0V40a8,8,0,0,1-16,0Zm72,88a64,64,0,1,1-64-64A64.07,64.07,0,0,1,192,128Zm-16,0a48,48,0,1,0-48,48A48.05,48.05,0,0,0,176,128ZM58.34,69.66A8,8,0,0,0,69.66,58.34l-16-16A8,8,0,0,0,42.34,53.66Zm0,116.68-16,16a8,8,0,0,0,11.32,11.32l16-16a8,8,0,0,0-11.32-11.32ZM192,72a8,8,0,0,0,5.66-2.34l16-16a8,8,0,0,0-11.32-11.32l-16,16A8,8,0,0,0,192,72Zm5.66,114.34a8,8,0,0,0-11.32,11.32l16,16a8,8,0,0,0,11.32-11.32ZM48,128a8,8,0,0,0-8-8H16a8,8,0,0,0,0,16H40A8,8,0,0,0,48,128Zm80,80a8,8,0,0,0-8,8v24a8,8,0,0,0,16,0V216A8,8,0,0,0,128,208Zm112-88H216a8,8,0,0,0,0,16h24a8,8,0,0,0,0-16Z"/></svg>
        <span class="to-dark" aria-hidden="true">Dark</span><span class="to-light" aria-hidden="true">Light</span>
      </button>
      <button type="button" class="btn account" id="account-button"><span class="account-name">Log in</span></button>
    </div>
  </header>

  <div class="hero">
    <img class="hero-photo" src="munich-1600.webp" srcset="munich-960.webp 960w, munich-1600.webp 1600w" sizes="100vw" alt="" width="1600" height="1078">
    <div class="hero-inner">
      <h1>AI events in Munich</h1>
      <p class="hero-sub" id="hero-sub">&nbsp;</p>
    </div>
    <p class="hero-credit"><a href="https://commons.wikimedia.org/wiki/File:Munich_skyline.jpg" target="_blank" rel="noopener">Photo: Stefan Kühn</a>, <a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener">CC BY-SA 3.0</a></p>
  </div>

  <main class="page">
    <div class="banner" id="banner" role="alert" hidden></div>

    <section id="view-timeline" role="tabpanel" aria-labelledby="tab-timeline">
      <div class="toolbar">
        <label class="field grow">
          <span>Search</span>
          <input id="q" type="search" autocomplete="off">
        </label>
        <label class="field">
          <span>Organiser</span>
          <select id="org-filter"><option value="">All organisers</option></select>
        </label>
        <div class="field" role="group" aria-labelledby="tier-label">
          <span id="tier-label">Tier</span>
          <div class="toggles" id="tier-toggles">
            <button type="button" class="toggle" data-tier="A" aria-pressed="true">A <span class="n"></span></button>
            <button type="button" class="toggle" data-tier="B" aria-pressed="true">B <span class="n"></span></button>
            <button type="button" class="toggle" data-tier="C" aria-pressed="true">C <span class="n"></span></button>
          </div>
        </div>
        <div class="field" role="group" aria-labelledby="also-label">
          <span id="also-label">Also show</span>
          <div class="toggles">
            <button type="button" class="toggle" id="show-past" aria-pressed="false">Past <span class="n"></span></button>
            <button type="button" class="toggle" id="show-dropped" aria-pressed="false">Online or outside Munich <span class="n"></span></button>
          </div>
        </div>
        <div class="field" role="group" aria-labelledby="only-label" id="starred-field" hidden>
          <span id="only-label">Show only</span>
          <div class="toggles">
            <button type="button" class="toggle" id="show-starred" aria-pressed="false">
              <!-- Phosphor Icons 2.1.1, fill weight (MIT) -->
              <svg class="star-icon" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M234.29,114.85l-45,38.83L203,211.75a16.4,16.4,0,0,1-24.5,17.82L128,198.49,77.47,229.57A16.4,16.4,0,0,1,53,211.75l13.76-58.07-45-38.83A16.46,16.46,0,0,1,31.08,86l59-4.76,22.76-55.08a16.36,16.36,0,0,1,30.27,0l22.75,55.08,59,4.76a16.46,16.46,0,0,1,9.37,28.86Z"/></svg>
              Starred <span class="n"></span></button>
          </div>
        </div>
      </div>
      <p class="count" id="timeline-count"></p>
      <div id="timeline-list" class="timeline"></div>
    </section>

    <section id="view-organisations" role="tabpanel" aria-labelledby="tab-organisations" hidden>
      <div class="toolbar">
        <label class="field grow">
          <span>Search</span>
          <input id="org-q" type="search" autocomplete="off">
        </label>
        <label class="field">
          <span>Kind</span>
          <select id="org-kind"><option value="">All kinds</option></select>
        </label>
        <label class="field">
          <span>Sort</span>
          <select id="org-sort">
            <option value="upcoming">Most upcoming events</option>
            <option value="problems">Problems first</option>
            <option value="name">Name</option>
          </select>
        </label>
        <button type="button" class="btn primary add-org" id="add-org">Add organisation</button>
      </div>
      <section class="intakes" id="intakes" aria-label="Organisations being added" hidden></section>
      <p class="count" id="org-count"></p>
      <div id="org-list" class="orgs"></div>
    </section>
  </main>

  <footer class="foot">
    <div class="foot-inner">
      <a href="impressum">Impressum</a>
      <a href="privacy">Privacy</a>
      <a href="https://github.com/AliAlpOezer/munich-event-radar" rel="noopener">Source code</a>
    </div>
  </footer>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
    <div class="drawer-head">
      <span class="tier-badge" id="drawer-tier"></span>
      <h2 id="drawer-title"></h2>
      <div class="drawer-actions"><span class="drawer-tools" id="drawer-tools"></span><button type="button" class="btn ghost" id="drawer-close">Close</button></div>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </aside>
  <div class="toast-region" role="status" aria-live="polite"><p class="toast" id="toast" hidden></p></div>

  <script src="vendor/supabase-js-2.117.2.js" defer></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
