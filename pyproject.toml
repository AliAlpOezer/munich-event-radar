[project]
name = "munich-event-radar"
version = "0.1.0"
description = "Finds Munich AI events and tracks their registration windows (ADR 0002)."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "protego>=0.3",
    "pyyaml>=6.0",
    "icalendar>=6.0",
    "selectolax>=0.3",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
calendar = ["google-auth>=2.29", "requests>=2.31"]
dev = ["pytest>=8.2", "ruff>=0.5"]

[project.scripts]
event-radar = "event_radar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_radar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
