# Relevance profile (Q3, Q5; ADR 0002 D6). The judge reads this; edit it to tune tiers.
# Recall first: unknown price never demotes an event. Unknown AI relevance counts as
# relevant only for organisers with `ai_focus: true` in seed/organisers.yaml, whose events
# not about AI are C (ADR 0018 D9). Elsewhere an event is C when it is in `scope`, and off
# topic otherwise (ADR 0011), so general calendars such as TUM's neither flood B nor fill
# the board with concerts.

munich:
  cities: [münchen, munich, muenchen, garching, garching bei münchen, martinsried, planegg,
           unterschleißheim, oberschleißheim, ismaning, unterföhring, aschheim, feldkirchen]
  postal_codes: ["80", "81", "85748", "85716", "85764", "82152", "85737", "85774", "85609"]

# Hosts whose pages list other organisers' events (AGG). Ticket platforms are TICKET;
# everything else is the organiser's own page (OWN).
aggregators: [messen.de, munich-startup.de, dealroom.co, brainberg.eu, eventbrite.com/d/,
              allevents.in, 10times.com, luma.com/discover, dev.events, conferenceindex.org,
              techmeetups.com, kommunity.com, eventmatch.co]

# Kinds that make a free, in-person, AI-relevant event A. Everything else free is B.
# Assumption (D6): free hackathons and programmes with an application window are A.
a_kinds: [career_fair, conference, symposium, flagship_lecture, hackathon, programme, demo_day,
          industry_talk]

# Kinds that surface even when AI relevance is unknown at an organiser without ai_focus:
# career fairs bring hiring companies (Q5 tier A), and free hackathons are A by the D6
# assumption. TUM's central listing is hackaTUM's only dated source until the LLM runs.
any_topic_kinds: [career_fair, hackathon]

# Stars lift a tier (ADR 0015): an event that at least this many accounts starred is at
# least this tier. Absolute counts, Alp's choice of 2026-10-19. A drop stays a drop.
stars:
  A: 10
  B: 5

# Keywords match the words of an event's title, description and organiser, lowercased and
# with punctuation read as a space, so "AI," and "(AI)" count and "aims" does not. Write them
# without punctuation; a leading or trailing space makes a word start or end there (" job"
# matches "jobs", " ai " only "ai", " llm" "LLMs" but not "enrollment"). The kind is read
# from the title alone: a description names other formats too ("a week of workshops,
# hackathons and networking").
keywords:
  ai: [" ki ", "künstliche intelligenz", " ai ", " a i ", "artificial intelligence",
       "machine learning", "maschinelles lernen", "deep learning", " llm", "nlp", "data science",
       "agent", "genai", "generative", "neural", "computer vision", "robotics", "mlops"]
  kinds:
    career_fair: [career fair, karrieremesse, job fair, jobmesse, recruiting day, firmenkontaktmesse]
    hackathon: [hackathon, makeathon, hacka, datathon]
    symposium: [symposium, symposien]
    conference: [conference, konferenz, summit, congress, kongress, forum]
    flagship_lecture: [signature lecture, munich ai lecture, distinguished lecture, keynote]
    demo_day: [demo day, pitch night, demo night]
    # Not application, bewerbung or apply: they name a registration mode (reg_mode), and
    # matched "Practical Applications" and "TUMexchange application" (2026-10-07).
    programme: [fellowship, accelerator, spring class]
    meetup: [meetup, stammtisch, community night]
    workshop: [workshop, masterclass, bootcamp]
    talk: [talk, vortrag, lecture, panel, diskussion, seminar, colloquium, kolloquium]

# The radar's scope besides AI (Alp, 2026-10-17; ADR 0011). An event is off topic, and is
# not stored, when it is not about AI, is of no `any_topic_kinds` kind, its organiser is
# neither AI-focused nor of kind `startup`, and its title, description and organiser hold
# none of these words. `developer` is Alp's "coding, developer" (2026-10-18; ADR 0014 D9);
# " coding " is a word, so "encoding" is not one.
scope:
  startup: [startup, start up, founder, gründer, gründung, entrepreneur, venture capital,
            accelerator, incubator, inkubator, pitch, investor, demo day]
  career: [career, karriere, " job", recruiting, hiring, internship, praktikum]
  developer: [" coding ", developer, programming, software engineer]

# The topics besides AI that keep an event once the LLM has judged what its page says (ADR
# 0018); the words of `scope` then no longer decide. An event judged to be about one of these
# is in scope, and C unless AI is one of its themes. `tech` is Alp's of 2026-10-20 (Schwarz
# Group's IT, cloud meetups); without it the scope is ADR 0011's AI, startups and careers.
topics: [startup, career, tech]

# Who the board is not for (Alp, 2026-10-17: "our audience is young adults/ adults", and
# families too; ADR 0012). An event aimed at one of these audiences is not stored, whatever
# its topic, organiser or date: when the LLM states that `audience`, or its title holds one
# of these phrases (curly apostrophes count as straight ones). A phrase names an event
# format for that audience, never a topic, so "AI in Children's Medicine" and "Family
# Office Summit" stay. Remove an audience to bring its events back.
audience:
  children: [children's university, children's program, kinderuni, kinder-uni, kinderprogramm,
             kids', for kids, für kids]
  school_pupils: [schüler, school pupils, for pupils, schoolchildren, girls' day, girls'day,
                  boys' day, boys'day, zukunftstag, abiturient]
  families: [family edition, family day, family program, for families, familientag,
             familienfest, familienprogramm, familienführung, für familien]

# Online-only signals, used when no parser states `attendance`. A venue counts only when the
# whole venue is one of `venues` (after lowercasing and folding punctuation), so hybrid venues
# such as "Online & Munich City Campus" stay in. `phrases` count only when the event has no
# venue or address (Meetup ICS has no LOCATION) and no `in_person` phrase.
online:
  venues: [online, online event, online veranstaltung, virtual, virtual event, zoom,
           microsoft teams, webex, google meet, webinar, livestream, live stream,
           live stream on youtube]
  phrases: [register for the zoom, virtual meetup, virtual event, online event, online only,
            online-only, nur online, online-veranstaltung]
  in_person: [in person, in-person, vor ort, präsenz, hybrid event, hybride veranstaltung]

# Organisation intake (ADR 0003). An anchor whose text or path contains one of these words
# is a candidate event source when a submitted site has no feed. Lower case; matched as
# whole words in the link text and as path segments.
intake:
  link_signals: [events, event, upcoming, veranstaltungen, veranstaltung, termine, termin,
                 kalender, calendar, agenda, meetups, meetup, workshops, hackathons]
  # Link text that points to an about or imprint page, which step 2 gives the LLM.
  about_signals: [about, about us, über uns, ueber uns, impressum, imprint, legal notice, team]

# The daily web search (ADR 0016). Each day takes the next `daily_cap` queries, one Tavily
# credit each; the free plan has 1,000 a month (checked 2026-10-19,
# https://docs.tavily.com/documentation/api-credits). A hit needs an AI or scope word and a
# Munich place in its title, snippet or URL, and at most `daily_candidates` wait for review
# a day. Excluded sites never hold an organiser's own events page; the form services are
# registration pages, not events. The news sites, job boards and listings added after the
# first dry run (2026-10-19: 25 searches, 104 unknown candidates) were its noise.
search:
  daily_cap: 25
  daily_candidates: 5
  queries:
    - AI meetup Munich
    - machine learning meetup Munich
    - data science meetup Munich
    - generative AI event Munich
    - AI agents meetup Munich
    - LLM workshop Munich
    - deep learning workshop Munich
    - computer vision meetup Munich
    - MLOps meetup Munich
    - AI hackathon Munich
    - hackathon Munich students
    - AI conference Munich
    - AI symposium Munich
    - AI lecture series Munich
    - AI talk Munich university
    - robotics AI event Munich
    - AI networking event Munich
    - AI startup event Munich
    - startup pitch night Munich
    - founder meetup Munich
    - venture capital event Munich
    - AI demo day Munich
    - tech career fair Munich
    - tech meetup Munich
    - KI Veranstaltung München
    - KI Meetup München
    - Künstliche Intelligenz Vortrag München
    - KI Workshop München
    - KI Konferenz München
    - Hackathon München
    - Maschinelles Lernen Vortrag München
    - Data Science Veranstaltung München
    - Startup Veranstaltung München
    - Gründer Event München
    - Karrieremesse München Informatik
    - KI Ringvorlesung München
    - KI Symposium München
    - Tech Event Garching
    - KI Netzwerktreffen München
    - Robotik KI Vortrag München
  exclude_domains: [linkedin.com, facebook.com, instagram.com, x.com, twitter.com, youtube.com,
                    tiktok.com, reddit.com, wikipedia.org, xing.com, indeed.com, stepstone.de,
                    glassdoor.com, glassdoor.de, typeform.com, tally.so, forms.gle,
                    docs.google.com, sueddeutsche.de, handelsblatt.com, faz.net, berufsstart.de,
                    dev.to, medium.com]

# Decisions a decision model may make instead of the LLM (ADR 0017). None is made yet; the
# calibration (`event-radar calibrate`) measures first. Whether a page states registration
# details is asked about the text around these words, not the whole page: one stood on every
# page with a verified registration field once the stem was "regist", and 95 of 96 grounding
# quotes lay within 300 characters of one (hosted pages, 2026-10-19).
decisions:
  registration:
    words: [anmeld, regist, ticket, apply, bewerb, sign up, eintritt, kostenlos, free, "€"]
    window: 300
