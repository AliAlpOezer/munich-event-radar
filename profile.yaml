    symposium: [symposium, symposien]
    conference: [conference, konferenz, summit, congress, kongress, forum]
    flagship_lecture: [signature lecture, munich ai lecture, distinguished lecture, keynote]
    demo_day: [demo day, pitch night, demo night]
