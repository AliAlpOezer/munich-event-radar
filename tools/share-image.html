<!doctype html>
<!-- The link preview that LinkedIn, WhatsApp and search engines show for the page:
     tools/share_image.py renders it to site/share.png at 1200 x 630. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    @font-face { font-family: "Space Grotesk"; font-weight: 500 700; src: url("../site/vendor/fonts/space-grotesk-v22-latin.woff2") format("woff2"); }
    @font-face { font-family: "Geist"; font-weight: 400 700; src: url("../site/vendor/fonts/geist-v5-latin.woff2") format("woff2"); }
    @font-face { font-family: "Geist Mono"; font-weight: 400 500; src: url("../site/vendor/fonts/geist-mono-v6-latin.woff2") format("woff2"); }
    * { margin: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative;
      background:
        radial-gradient(70% 90% at 0% 0%, rgb(29 95 191 / 0.45), transparent 70%),
        radial-gradient(50% 70% at 100% 100%, rgb(217 84 30 / 0.22), transparent 70%),
        #0d1830;
      color: #e8eef9;
      font-family: "Geist", sans-serif;
    }
    .strip { position: absolute; inset: 0 0 auto; height: 10px; background: linear-gradient(90deg, #1d5fbf, #4a98e6 35%, #f6a23c 65%, #d9541e); }
    .radar { position: absolute; left: 590px; top: -65px; width: 760px; height: 760px; }
    /* The sweep trails its leading line (18 degrees above the horizontal) by 45 degrees. */
    .sweep {
      position: absolute; left: 610px; top: -45px; width: 720px; height: 720px; border-radius: 50%;
      background: conic-gradient(transparent 27deg, rgb(246 162 60 / 0.4) 72deg, transparent 72deg);
    }
    .copy { position: absolute; left: 84px; top: 92px; width: 680px; }
    .brand { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 34px; letter-spacing: -0.01em; }
    .brand b { background: linear-gradient(100deg, #7db3ff, #f6a23c); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .brand span { color: #9fb0cc; font-weight: 500; }
    h1 { margin-top: 44px; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 104px; line-height: 0.98; letter-spacing: -0.03em; }
    p { margin-top: 30px; font-size: 32px; line-height: 1.3; color: #c3d0e6; }
    .url { position: absolute; left: 84px; bottom: 64px; font-family: "Geist Mono", monospace; font-size: 28px; color: #f6a23c; }
  </style>
</head>
<body>
  <div class="strip"></div>
  <div class="sweep"></div>
  <svg class="radar" viewBox="-380 -380 760 760" aria-hidden="true">
    <g fill="none" stroke="#7db3ff" stroke-opacity="0.22" stroke-width="2">
      <circle r="90"/><circle r="180"/><circle r="270"/><circle r="360"/>
      <path d="M-360 0H360M0 -360V360"/>
    </g>
    <line x1="0" y1="0" x2="360" y2="0" stroke="#f6a23c" stroke-width="3" stroke-opacity="0.9" transform="rotate(-18)"/>
    <g>
      <circle cx="196" cy="-128" r="13" fill="#f6a23c"/>
      <circle cx="104" cy="-236" r="10" fill="#f6a23c" fill-opacity="0.85"/>
      <circle cx="150" cy="40" r="10" fill="#7db3ff"/>
      <circle cx="-150" cy="-196" r="9" fill="#7db3ff" fill-opacity="0.8"/>
      <circle cx="-120" cy="150" r="11" fill="#f6a23c" fill-opacity="0.7"/>
      <circle cx="-62" cy="232" r="8" fill="#7db3ff" fill-opacity="0.7"/>
      <circle cx="148" cy="190" r="9" fill="#7db3ff" fill-opacity="0.6"/>
      <circle cx="-40" cy="-120" r="7" fill="#9fb0cc" fill-opacity="0.6"/>
      <circle cx="0" cy="0" r="7" fill="#e8eef9"/>
    </g>
  </svg>
  <div class="copy">
    <div class="brand"><b>Event Radar</b> <span>Munich</span></div>
    <h1>AI events in Munich</h1>
    <p>The ones worth going to, ranked, with when registration opens and closes. Updated daily.</p>
  </div>
  <div class="url">munichai.pages.dev</div>
</body>
</html>
